# Положите в репозиторий как .github/workflows/build.yml
# (корень репозитория = содержимое папки ShareDL: settings.gradle.kts, app/, ...)
name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy требует на машине сборки Python той же минорной версии, что в app/build.gradle.kts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: android-actions/setup-android@v3

      # gradlew в проекте нет — ставим Gradle 8.7 (нужен для AGP 8.5.2)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ShareDL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
