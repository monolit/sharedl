name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # нужно только для публикации релиза по тегу v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy: Python на машине сборки должен совпадать с версией в app/build.gradle.kts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Android SDK уже есть на раннере; просто принимаем лицензии (сбой не критичен)
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # gradlew в проекте нет — ставим Gradle 8.7 (нужен для AGP 8.5.2)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # Подпись из GitHub Secrets; если секретов нет — release подпишется отладочным ключом
      - name: Prepare keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 не задан — APK подписан отладочным ключом"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ShareDL-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
