# Положите в репозиторий как .github/workflows/build.yml
name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy: Python на машине сборки должен совпадать с версией в app/build.gradle.kts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Android SDK уже есть на раннере; просто принимаем лицензии (сбой не критичен)
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # gradlew в проекте нет — ставим Gradle 8.7 (нужен для AGP 8.5.2)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ShareDL-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
